# Command-line access to the migrations, e.g.:
#   PARSER_DATABASE_URL=sqlite:///var/parser.sqlite3 uv run alembic upgrade head
# The service applies migrations itself at start-up; this file is for operators and reviews.
[alembic]
script_location = src/ParserService/Infrastructure/Persistence/Migrations
version_locations = src/ParserService/Infrastructure/Persistence/Migrations/Versions
path_separator = os
file_template = %%(slug)s
