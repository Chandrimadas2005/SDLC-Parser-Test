# One command starts the whole service: `docker compose up`.
# Values with defaults here are synthetic; copy .env.example to .env to override them.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parser}
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parser-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parser} -d ${POSTGRES_DB:-parser}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1.0

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PARSER_DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-local-only}@postgres:5432/${POSTGRES_DB:-parser}
      PARSER_ARTIFACT_ROOT: /var/lib/parser/artifacts
      PARSER_LOG_LEVEL: ${PARSER_LOG_LEVEL:-INFO}
      PARSER_MAX_FILE_SIZE_BYTES: ${PARSER_MAX_FILE_SIZE_BYTES:-104857600}
      PARSER_QUEUE_CAPACITY: ${PARSER_QUEUE_CAPACITY:-500}
      PARSER_RETENTION_DAYS: ${PARSER_RETENTION_DAYS:-30}
      PARSER_MIN_FREE_DISK_BYTES: ${PARSER_MIN_FREE_DISK_BYTES:-2147483648}
    ports:
      - "${PARSER_HTTP_PORT:-8000}:8000"
    volumes:
      - artifacts:/var/lib/parser/artifacts
    # Container-level limits (brief 2.6, Isolation). Per-job limits come in Phase 3.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m
    restart: unless-stopped

  worker:
    # Takes queued jobs and parses each file in its own short-lived process with time
    # and memory limits (brief 2.5). Shares the artifact volume with the API.
    build: .
    command: ["parser-worker"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      PARSER_DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-parser}:${POSTGRES_PASSWORD:-parser-local-only}@postgres:5432/${POSTGRES_DB:-parser}
      PARSER_ARTIFACT_ROOT: /var/lib/parser/artifacts
      PARSER_LOG_LEVEL: ${PARSER_LOG_LEVEL:-INFO}
      PARSER_JOB_TIMEOUT_SECONDS: ${PARSER_JOB_TIMEOUT_SECONDS:-300}
      # Per-job limit stays below the container limit, so one bad file kills only its
      # own process, never the worker container.
      PARSER_JOB_MEMORY_LIMIT_MB: ${PARSER_JOB_MEMORY_LIMIT_MB:-1024}
      # Jobs parsed at once; blank means derived from the container memory (see README).
      PARSER_WORKER_CONCURRENCY: ${PARSER_WORKER_CONCURRENCY:-}
    volumes:
      - artifacts:/var/lib/parser/artifacts
    # No HTTP port: healthy while the worker process (PID 1) is running.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'parser-worker' in open('/proc/1/cmdline', 'rb').read() else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m
    restart: unless-stopped

volumes:
  postgres-data:
  artifacts:
